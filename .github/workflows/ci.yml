name: Pipeline CI/CD Support IA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 🔄 Étape 1 : Mise à jour de v4 à v4 (la v4 récente intègre le patch Node 24)
    - name: Récupération du code source
      uses: actions/checkout@v4

    # 🔄 Étape 2 : On passe de @v5 à @v5.3.0 (ou v5 directement qui pointe sur la dernière stable compatible Node 24)
    - name: Configuration de Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Exécution des tests unitaires
      run: |
        python -m unittest test_pipeline.py